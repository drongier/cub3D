<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cub3D</title>
<style>
  :root { --bg: #111; --panel: #1c1c1c; --fg: #eee; --dim: #999; --accent: #e03020; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, sans-serif; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; display: flex;
    align-items: center; justify-content: center; }
  /* SDL fixe la taille du canvas : on l'agrandit sans déformer l'image */
  #canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)) !important;
    height: auto !important; aspect-ratio: 16 / 9; image-rendering: pixelated;
    background: #000; outline: none; }
  #menu { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(0, 0, 0, .82); }
  #menu .box { background: var(--panel); padding: 28px 32px; border-radius: 10px;
    max-width: 560px; width: calc(100% - 32px); box-sizing: border-box; }
  h1 { margin: 0 0 4px; font-size: 32px; letter-spacing: 2px; }
  p { margin: 0 0 16px; color: var(--dim); }
  #maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px; margin-bottom: 18px; }
  button { font: inherit; color: var(--fg); background: #2a2a2a; border: 1px solid #444;
    border-radius: 6px; padding: 10px 12px; cursor: pointer; text-align: left; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  button small { display: block; color: var(--dim); font-size: 12px; }
  .keys { font-size: 14px; color: var(--dim); }
  .keys b { color: var(--fg); font-weight: 600; }
  #status { margin-top: 12px; font-size: 14px; color: var(--dim); white-space: pre-wrap; }
  #status.error { color: #ff7060; }
  #back { position: absolute; top: 8px; right: 12px; color: var(--dim); font-size: 13px;
    text-decoration: none; display: none; }
  #back:hover { color: var(--fg); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <a id="back" href="">Changer de map</a>
  <div id="menu"><div class="box">
    <h1>cub3D</h1>
    <p>Raycaster en C et SDL3, compilé en WebAssembly.</p>
    <div id="maps"></div>
    <div class="keys">
      <b>W A S D</b> (Z Q S D en AZERTY) : se déplacer &nbsp;·&nbsp; <b>← →</b> : tourner<br>
      <b>Maj</b> : sprint &nbsp;·&nbsp; <b>Espace</b> ou <b>clic</b> : tirer, recommencer après la mort
    </div>
    <div id="status">Chargement…</div>
  </div></div>
</div>
<script>
  var MAPS = [
    ["waves", "Vagues", "survivre aux vagues de mutants"],
    ["mutants", "Mutants", "8 mutants, 3 trousses"],
    ["map", "Map", "quelques mutants"],
    ["dungeon", "Donjon", "exploration"],
    ["library", "Bibliothèque", "exploration"],
    ["creepy", "Creepy", "exploration"],
    ["cheese_maze", "Labyrinthe", "exploration"],
    ["matrix", "Matrix", "exploration"]
  ];
  var statusEl = document.getElementById("status");
  var buttons = [];
  var errors = "";

  MAPS.forEach(function (m) {
    var b = document.createElement("button");
    b.disabled = true;
    b.innerHTML = m[1] + "<small>" + m[2] + "</small>";
    b.onclick = function () { start(m[0]); };
    document.getElementById("maps").appendChild(b);
    buttons.push(b);
  });

  function start(name) {
    document.getElementById("menu").style.display = "none";
    document.getElementById("back").style.display = "block";
    document.getElementById("canvas").focus();
    history.replaceState(null, "", "?map=" + name);
    Module.callMain(["maps/good/" + name + ".cub"]);
  }

  /* Une erreur de chargement de la scène : on la montre dans le menu */
  function showError(text) {
    errors += text + "\n";
    document.getElementById("menu").style.display = "flex";
    statusEl.className = "error";
    statusEl.textContent = errors;
  }

  var Module = {
    canvas: document.getElementById("canvas"),
    print: function (t) { console.log(t); if (/^Error|^line|^cannot/.test(t)) showError(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { if (t) statusEl.textContent = t; },
    onRuntimeInitialized: function () {
      buttons.forEach(function (b) { b.disabled = false; });
      statusEl.textContent = "Choisis une map.";
    }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
